[project]
name = "sinewave"
version = "0.1.0"
description = "Simple command-line tool for creating audio files containing pure sine wave tones"
authors = [
    {name = "DJ Stomp",email = "85457381+DJStompZone@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "numpy (>=2.5.3,<3.0.0)",
    "soundfile (>=0.14.0,<0.15.0)"
]

[tool.poetry]
packages = [{include = "sinewave"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
sinewave = "sinewave.__main__:main"